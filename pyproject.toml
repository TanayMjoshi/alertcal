[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertcal"
version = "0.1.0"
description = "Recalibrate anomaly-alert thresholds after deployment shift. Scores in, thresholds out."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tanay Joshi" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]
experiments = ["scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
alertcal = "alertcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
